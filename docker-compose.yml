services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      # Indicate that only the API should run, skipping other initialization steps
      API_ONLY: "true"
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISABLE_SYNC_TRIGGER: ${DISABLE_SYNC_TRIGGER:-false}
    volumes:
      # Mount .env file to ensure it's available
      - ./backend/.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sync-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Optional: Skip initial ingestion on startup (set to true if you want faster startup)
      SKIP_INITIAL_INGEST: ${SKIP_INITIAL_INGEST:-false}
      # Ensure the worker runs all initialization steps
      API_ONLY: false
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["npm", "run", "worker:eas"]
    volumes:
      - ./backend/.env:/app/.env:ro
